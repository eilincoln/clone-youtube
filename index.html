<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Clone - BertoCodes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <header class="header">
    <div class="header-left">
      <button class="icon-btn" aria-label="Abrir menu">
        <span class="material-symbols-rounded">menu</span>
      </button>

      <a href="#" class="logo">
        <span class="logo-icon material-symbols-rounded">play_arrow</span>
        BertoTube
      </a>
    </div><!--header-left-->

    <form class="search">
      <input type="search" placeholder="Pesquisar">
      <button class="icon-btn" type="submit" aria-label="Pesquisar">
        <span class="material-symbols-rounded">search</span>
      </button>
    </form><!--search-->

    <div class="header-right">
      <button class="icon-btn" aria-label="Enviar vídeo">
        <span class="material-symbols-rounded">add</span>
      </button>
      <button class="icon-btn" aria-label="Notificações">
        <span class="material-symbols-rounded">notifications</span>
      </button>
      <span class="avatar">L</span>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <nav class="menu" aria-label="Principal">

        <a href="#" class="menu-item">
          <span class="material-symbols-rounded">home</span>
          Início
        </a>

        <a href="#" class="menu-item">
          <span class="material-symbols-rounded">explore</span>
          Explorar
        </a>

        <a href="#" class="menu-item">
          <span class="material-symbols-rounded">bolt</span>
          Shorts
        </a>

        <a href="#" class="menu-item">
          <span class="material-symbols-rounded">subscriptions</span>
          Incrições
        </a>
      </nav>

      <hr class="menu-divider">

      <nav class="menu" aria-label="Sua biblioteca">
        <p class="menu-title">Você</p>
        <a href="#" class="menu-item">
          <span class="material-symbols-rounded">history</span>
          Histórico
        </a>

        <a href="#" class="menu-item">
          <span class="material-symbols-rounded">schedule</span>
          Ver depois
        </a>

        <a href="#" class="menu-item">
          <span class="material-symbols-rounded">thumb_up</span>
          Curtidos
        </a>
      </nav>


    </aside>

    <main class="content"></main>
  </div>
</body>

</html>
